spring.application.name=lolCitas

# Lee el archivo .env (si existe) de la carpeta desde donde se arranca la app
spring.config.import=optional:file:.env[.properties]

# Puerto: los hostings (Render, Railway, etc.) inyectan PORT
server.port=${PORT:8080}

# ===== Base de datos Neon (PostgreSQL) =====
# Las credenciales NUNCA van en el repo: se leen de variables de entorno.
# Ejemplo de DB_URL (lo copias del dashboard de Neon, formato JDBC):
#   jdbc:postgresql://ep-xxxx-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno: el plan gratis de Neon limita conexiones y "duerme" la BD
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
# "update" crea/actualiza las tablas a partir de las entidades (comodo en desarrollo)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== CORS =====
# Origenes del frontend separados por coma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}
