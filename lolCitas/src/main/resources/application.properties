spring.application.name=lolCitas

# --- Conexion a PostgreSQL (Neon) ---
# Las credenciales se leen de variables de entorno para no subirlas a GitHub.
#   DB_URL      = jdbc:postgresql://<host-de-neon>/<base>?sslmode=require
#   DB_USERNAME = usuario de Neon
#   DB_PASSWORD = clave de Neon
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Las tablas ya existen (se crearon con el script SQL): Hibernate solo
# verifica que las entidades calcen con ellas, no crea ni modifica nada.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
